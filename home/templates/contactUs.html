<!-- CONTACT -->
{% extends "main.html" %} {% block content %}

<section class="contact" id="contact">
  <div class="contact-text">
    <h2>Let's build something <em>remarkable</em></h2>
    <p>
      Whether you have a clear brief or just an idea, we'd love to hear from
      you. Every great project starts with a conversation.
    </p>
    <div class="contact-info">
      <a href="mailto:hello@nova.studio" class="contact-link">
        <span class="icon">✉</span> hello@nova.studio
      </a>
      <a href="tel:+15551234567" class="contact-link">
        <span class="icon">☎</span> +1 (555) 123-4567
      </a>
      <a href="#" class="contact-link">
        <span class="icon">✦</span> New York · London · Mumbai
      </a>
    </div>
  </div>
  <form class="contact-form" onsubmit="handleSubmit(event)">
    <input class="field" type="text" placeholder="Your name" required />
    <input class="field" type="email" placeholder="Email address" required />
    <input class="field" type="text" placeholder="Subject" />
    <textarea
      class="field"
      placeholder="Tell us about your project…"
      required
    ></textarea>
    <button type="submit" class="btn-submit">Send Message →</button>
  </form>
</section>
{% endblock %}
